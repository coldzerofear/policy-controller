name: CI (fork)

# fork-specific CI: 跑得通 + 镜像 build 通,不要 GCP。
# Upstream 的 build.yaml / release.yaml 依赖 sigstore 项目的 GCP workload
# identity,fork 上必挂——但我们不删它(保持 rebase 容易),只是不依赖它。

on:
  push:
    branches:
      - main
      - zjrcu-gm    # 我们 GM 改造分支
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Vet
        run: go vet ./...

      # 跑单元测试,不跑 kind 集群 e2e(那个 upstream 也有,fork 不需要重做)
      - name: Unit tests
        run: go test -count=1 -timeout 5m ./pkg/...

  build-image:
    name: Build container image (no push)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Set up ko
        uses: ko-build/setup-ko@v0.9
        with:
          version: v0.18.0

      # ko build --push=false 只验证镜像能构出来(amd64 + arm64),不推 registry。
      # 这是 PR 反馈用,真正 push 走 release.yml(tag 触发)。
      - name: ko build (verify multi-arch image builds clean)
        env:
          KO_DOCKER_REPO: ko.local
          GIT_HASH: ${{ github.sha }}
          GIT_VERSION: dev-${{ github.run_id }}
          LDFLAGS: ""
        run: |
          ko build \
            --bare \
            --push=false \
            --platform=linux/amd64,linux/arm64 \
            github.com/sigstore/policy-controller/cmd/webhook
