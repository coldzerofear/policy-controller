# 国密 (Chinese national crypto, SM2/SM3) ClusterImagePolicy 示例
#
# 用法：当 Authority 设置了 `gmSignature` 字段时,webhook 路由到 pkg/webhook/gm
# 的国密验签器,而不是默认 cosign ECDSA。CIP 没有 gmSignature 的 Authority
# 100% 沿用上游行为,这个 fork 对它们零影响。
#
# 工作流程：
#   1. webhook 检测到 authority.gmSignature != nil → 走 GM 路径
#   2. cosign SDK 拉镜像的签名工件(Referrers + tag-based 双轨,跟原 cosign 路径同)
#   3. 对每个 sig 工件:比对它的 layer annotations 上的 signer 三元组
#      (zjrcu.gm/signer-app-id, signer-node-id, user-id) 跟本 authority 配的
#      gmSignature.signer 字段——不匹配直接拒,不调 HSM
#   4. 匹配的话:本地 SM3 哈希 + 调 HSM /sm2/verify (URL 模板 + tenantId +
#      signer 三元组都从 gmSignature 字段拼出来)
#   5. HSM 返 verified=true → 通过
#
# 一个 CIP 可以混合 gmSignature 和传统 key/keyless authority,只要每个 Authority
# 各自配置正确就行。

apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: gm-zjrcu-harbor
spec:
  images:
    - glob: "harbor.zjrcu.com/**"
    - glob: "tcaas-harbor.zrubdev/**"
  authorities:
    - name: zjrcu-gm
      gmSignature:
        # HSM /sm2/verify endpoint URL 模板。{tenantId} {appId} 占位符运行时替换。
        verifyUrl: "http://158.218.101.121:28080/fc-api/v3.0/{tenantId}/{appId}/sm2/verify"
        # HSM 平台租户。代入 verifyUrl {tenantId} + 作为 Tenant-Id HTTP header。
        tenantId: vc02efvv9vqgam0j
        # 期望的签名者三元组。sig 工件上的对应 annotations 必须一致才会调 HSM。
        signer:
          appId: "00013310"
          nodeId: "0101"
          # userId 可选 — 配上 sig 的 user-id 必须严格匹配;不配则任意 user-id 都过
          userId: "1234567812345678"
        # 可选,HSM 调用超时(ms),默认 5000
        # requestTimeoutMs: 8000
