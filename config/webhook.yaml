---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook
  namespace: cosign-system
spec:
  selector:
    matchLabels:
      role: webhook
  template:
    metadata:
      labels:
        role: webhook
    spec:
      # To avoid node becoming SPOF, spread our replicas to different nodes.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  role: webhook
              topologyKey: kubernetes.io/hostname
            weight: 100

      serviceAccountName: webhook
      containers:
      - name: webhook
        # This is the Go import path for the binary that is containerized
        # and substituted here.
        image: ko://github.com/sigstore/policy-controller/cmd/webhook
        args: [
          # ─────────────────────────────────────────────────────────────
          # 国密 (GM) fork 的默认值:关掉 TUF。
          # TUF 是 sigstore 给 cosign keyless / Fulcio / Rekor 用的信任根
          # 分发机制,启动期会去 tuf-repo-cdn.sigstore.dev 拉 root.json。
          # 我们用 HSM SM2 验签,不走 Fulcio/Rekor 链路,TUF 对我们无用;
          # 而且测试 / 内网环境往往连不到 sigstore.dev,TUF init 会 panic
          # 导致 webhook pod 启动直接挂(`no such host`)。
          # 如果哪天需要 keyless 流程,把这行删掉,再配 tuf-mirror / tuf-root。
          "--disable-tuf",
          # ─────────────────────────────────────────────────────────────
          # Uncomment to customize ClusterImagePolicy resync period
          # "--policy-resync-period", "10h",
        ]
        resources:
          requests:
            cpu: 40m
            memory: 40Mi
          limits:
            cpu: 400m
            memory: 400Mi
        env:
        - name: SYSTEM_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CONFIG_LOGGING_NAME
          value: config-logging
        - name: METRICS_DOMAIN
          value: sigstore.dev/policy
        - name: WEBHOOK_NAME
          value: webhook
        - name: KUBERNETES_MIN_VERSION
          value: "1.21.0"
        - name: HOME
          value: "/var/run/sigstore"

        # ── 国密 (GM) 验签器调优 ──
        # 这些 env 变量是 pkg/webhook/gm 启动期读的(cmd/webhook/main.go)。
        # CIPs 不带 GMSignature 字段的话这些 env 完全不影响,跟上游行为一致。
        - name: GM_CACHE_CAPACITY
          # 正向 verify 结果缓存的 LRU 上限。每条 ~64 字节;4096 ≈ 256 KB。
          # 0 = 全局关缓存(每次都打 HSM)。
          value: "4096"
        - name: GM_CACHE_TTL_SECONDS
          # 每条 cache entry 有效期。30s 短到 cert 轮换很快失效,长到能吸
          # 收 Pod-burst(节点重启、Deployment scale)。0 = 关缓存。
          value: "30"

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL

        volumeMounts:
        - name: homedir
          mountPath: "/var/run/sigstore"
        - name: tuf-root
          mountPath: "/var/run/tuf"
          readOnly: true

        readinessProbe: &probe
          failureThreshold: 6
          initialDelaySeconds: 20
          periodSeconds: 1
          httpGet:
            scheme: HTTPS
            port: 8443
            httpHeaders:
            - name: k-kubelet-probe
              value: "webhook"
        livenessProbe: *probe

      # Our webhook should gracefully terminate by lame ducking first, set this to a sufficiently
      # high value that we respect whatever value it has configured for the lame duck grace period.
      terminationGracePeriodSeconds: 300

      volumes:
      - emptyDir: {}
        name: homedir
      - name: tuf-root
        secret:
          secretName: tuf-root
          # This is marked as optional, since if you are using public
          # instance, TUF root is built in to the cosign container.
          optional: true
          items:
          - key: root
            path: root.json

---
